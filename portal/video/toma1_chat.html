<!doctype html><html lang="es-CO"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chat</title>
<link rel="stylesheet" href="../fonts/fonts.css">
<style>*{box-sizing:border-box}body{margin:0;background:#ECE9E4;font:15px/1.4 'Inter Tight',sans-serif;color:#1d1d1d;height:100vh;overflow:hidden}
.bar{background:#2E3A46;color:#fff;padding:14px 16px;display:flex;align-items:center;gap:12px}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;flex:none}
.bar b{display:block;font-size:16px}.bar small{opacity:.75;font-size:12px}
.lista{background:#fff}.it{display:flex;gap:12px;padding:11px 14px;border-bottom:1px solid #eee;align-items:center;animation:in .35s both}
.it div{flex:1;min-width:0}.it b{font-size:15px}.it p{margin:2px 0 0;color:#666;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .n{background:#C0392B;color:#fff;border-radius:999px;font-size:11.5px;font-weight:700;min-width:20px;height:20px;display:grid;place-items:center;padding:0 6px}
.it time{font-size:11px;color:#C0392B;display:block;text-align:right;margin-bottom:4px}
@keyframes in{from{opacity:0;transform:translateY(-12px)}}
#chat{display:none;flex-direction:column;height:calc(100vh - 66px)}
.msgs{flex:1;padding:14px;display:flex;flex-direction:column;gap:8px;overflow:hidden;justify-content:flex-end}
.m{max-width:78%;background:#fff;padding:8px 11px;border-radius:12px 12px 12px 3px;box-shadow:0 1px 1px rgba(0,0,0,.08);animation:pop .3s both;font-size:15px}
.m small{display:block;text-align:right;color:#999;font-size:10.5px}
@keyframes pop{from{opacity:0;transform:scale(.9) translateY(8px)}}
.esc{font-size:12.5px;color:#666;padding:0 14px 8px;font-style:italic}
.in{display:flex;gap:8px;padding:10px;background:#F6F4F1}.in span{flex:1;background:#fff;border-radius:20px;padding:10px 14px;color:#999}
</style></head><body>
<div class="bar" id="bar"><div><b>Mensajes</b><small id="cnt">47 sin leer</small></div></div>
<div class="lista" id="lista"></div>
<div id="chat"><div class="msgs" id="msgs"></div><div class="esc" id="esc"></div><div class="in"><span>Escriba un mensaje</span></div></div>
<script>
const C=[['Clienta Ejemplo','#7A4E2D','Doctora, ¿y mi proceso cómo va?','7:42',6],['Cliente Ejemplo 1','#2D5A7A','Doctora, buenos días, ¿ya salió algo del juzgado?','7:38',4],['Cliente Ejemplo 2','#5B2D7A'.replace('5B2D7A','6B6B2D'),'¿Ya nos notificaron? Quedo pendiente','7:31',3],['Cliente Ejemplo 3','#2D7A55','Doctora, ¿y mi proceso cómo va?','7:20',5],['Cliente Ejemplo 4','#7A2D3E','Buenas, ¿cuándo es la audiencia?','7:05',2],['Cliente Ejemplo 5','#3E3E3E','¿Me puede mandar el número del radicado?','6:58',3],['Cliente Ejemplo 6','#2D6B7A','Doctora, ¿y lo mío para cuándo?','6:44',4],['Cliente Ejemplo 7','#7A5E2D','¿Hubo algún movimiento esta semana?','6:30',2],['Cliente Ejemplo 8','#4A2D7A'.replace('4A2D7A','5A5A5A'),'Doctora, disculpe la molestia otra vez…','6:12',7],['Cliente Ejemplo 9','#2D4A7A','¿Ya contestaron la demanda?','5:59',2]];
const L=document.getElementById('lista');
C.forEach((c,i)=>setTimeout(()=>{const d=document.createElement('div');d.className='it';d.innerHTML='<div class="av" style="background:'+c[1]+'">'+c[0].split(' ').map(s=>s[0]).join('')+'</div><div><b>'+c[0]+'</b><p>'+c[2]+'</p></div><div><time>'+c[3]+'</time><span class="n">'+c[4]+'</span></div>';L.prepend(d)},150+i*180));
setTimeout(()=>{L.style.display='none';document.getElementById('chat').style.display='flex';document.getElementById('bar').innerHTML='<div class="av" style="background:#7A4E2D">CE</div><div><b>Clienta Ejemplo</b><small>en línea</small></div>';
 const M=['Buenos días doctora','¿Ya salió algo del juzgado?','Doctora, ¿y mi proceso cómo va?','Es que no he podido dormir pensando en eso','¿Me llama cuando pueda?','Doctora, ¿y mi proceso cómo va?'];const h=['7:36','7:37','7:39','7:40','7:41','7:42'];
 M.forEach((t,i)=>setTimeout(()=>{const d=document.createElement('div');d.className='m';d.innerHTML=t+'<small>'+h[i]+'</small>';document.getElementById('msgs').append(d)},i*520));
 setTimeout(()=>document.getElementById('esc').textContent='Clienta Ejemplo está escribiendo…',3300);
},2600);
</script><div class="lm-ficticio" role="note" style="position:fixed;right:8px;bottom:8px;z-index:2147483647;background:rgba(27,27,27,.82);color:#F4EFE6;font:600 11px/1.3 system-ui,sans-serif;padding:4px 9px;border-radius:999px;pointer-events:none;letter-spacing:.02em">Datos ficticios con fines de demostración</div>
</body></html>
