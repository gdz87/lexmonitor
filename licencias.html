<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>LexMonitor · Licencias por firma</title>
<style>body{font:15px system-ui,sans-serif;max-width:1100px;margin:1.5rem auto;padding:0 1rem;color:#1d2733}.card{border:1px solid #d5dbe3;border-radius:10px;padding:1rem;margin:1rem 0}label{display:block;font-weight:600;margin:.4rem 0 .2rem}input,select{padding:.4rem;border:1px solid #b9c2cf;border-radius:6px;width:100%;box-sizing:border-box}button{padding:.4rem .7rem;border-radius:6px;border:0;background:#1f4fa3;color:#fff;cursor:pointer;margin:.1rem}button.sec{background:#e8edf5;color:#1d2733}.row{display:flex;gap:.6rem;flex-wrap:wrap}.row>div{flex:1;min-width:140px}table{border-collapse:collapse;width:100%;font-size:.88rem}td,th{border-bottom:1px solid #e3e7ee;padding:.35rem;text-align:left;vertical-align:top}.hide{display:none}.ok{color:#14532d}.ko{color:#991b1b}code{font-size:.85rem}</style></head><body>
<h1>🔑 LexMonitor · Cuentas y licencias por firma</h1>
<p><small>Los códigos de invitación (LEX-…) siguen en <a href="admin.html">admin.html</a> y funcionan con la app completa. Aquí se crean firmas y licencias (LIC-…), se renuevan, revocan y se ven los dispositivos.</small></p>
<div class="card" id="login"><label for="srv">URL del servidor</label><input id="srv"><label for="tok">Token de administrador</label><input id="tok" type="password" autocomplete="off"><button id="entrar">Entrar</button></div>
<div id="panel" class="hide">
<div class="card"><b>Nueva firma (cuenta)</b><div class="row"><div><label for="cf">Firma</label><input id="cf"></div><div><label for="cn">NIT</label><input id="cn"></div><div><label for="ce">Correo</label><input id="ce"></div></div><button id="ccrear">Crear cuenta</button></div>
<div class="card"><b>Nueva licencia</b><div class="row"><div><label for="lc">Cuenta</label><select id="lc"></select></div><div><label for="ld">Días de suscripción</label><input id="ld" type="number" value="30" min="1" max="400"></div><div><label for="lq">Consultas IA/día</label><input id="lq" type="number" value="100"></div><div><label for="lm">Dispositivos simultáneos</label><input id="lm" type="number" value="2" min="1" max="50"></div></div><button id="lcrear">Crear licencia</button></div>
<div class="card"><div class="row" style="justify-content:space-between"><b>Licencias y códigos</b><span><button class="sec" id="migrar" title="Marca los códigos LEX existentes como invitaciones heredadas (siguen completos)">Migrar invitaciones</button><button class="sec" id="recargar">↻</button><button class="sec" id="salir">Salir</button></span></div><div id="lista">…</div></div></div>
<p id="msg"></p>
<script>
const $=s=>document.querySelector(s),E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
$('#srv').value=sessionStorage.getItem('lm_adm_srv')||localStorage.getItem('lm_adm_srv')||(window.LM_PROXY||'https://lexmonitor-proxy.gdz87.workers.dev');
const S=()=>sessionStorage.getItem('lm_adm_srv').replace(/\/$/,''),T=()=>sessionStorage.getItem('lm_adm_tok');
const msg=(t,ok)=>{$('#msg').innerHTML=t?'<span class="'+(ok?'ok':'ko')+'">'+E(t)+'</span>':'';};
async function api(p,o={}){const r=await fetch(S()+p,{...o,headers:{'Content-Type':'application/json',Authorization:'Bearer '+T()}});const b=await r.json().catch(()=>({}));if(!r.ok)throw new Error((b.error&&b.error.message)||('Error '+r.status));return b;}
const f=s=>new Date(s).toLocaleDateString('es-CO',{timeZone:'America/Bogota'});
async function cargar(){try{const{cuentas}=await api('/admin/cuentas');const CT={};cuentas.forEach(c=>CT[c.id]=c);$('#lc').innerHTML=cuentas.map(c=>'<option value="'+E(c.id)+'">'+E(c.firma)+' ('+E(c.id)+')</option>').join('');
 const{licencias}=await api('/admin/licencias');licencias.sort((a,b)=>b.creado.localeCompare(a.creado));
 $('#lista').innerHTML='<table><tr><th>Código</th><th>Tipo</th><th>Titular</th><th>Vence</th><th>Estado</th><th>Disp.</th><th>Acciones</th></tr>'+licencias.map(l=>'<tr><td><code>'+E(l.codigo)+'</code></td><td>'+E(l.tipo)+'</td><td>'+E(l.cuenta?(CT[l.cuenta]||{}).firma||l.nombre:l.nombre)+'</td><td>'+f(l.vence)+' ('+l.diasRestantes+' d)</td><td>'+(l.revocado?'<b class="ko">revocada</b> '+E(l.motivo):!l.activo?'desactivado':l.vencido?'vencida':'<span class="ok">vigente</span>')+'</td><td>'+(l.maxDispositivos||'—')+'</td><td><button class="sec" data-a="renovar" data-c="'+E(l.codigo)+'">+30 d</button>'+(l.revocado?'<button class="sec" data-a="reactivar" data-c="'+E(l.codigo)+'">Reactivar</button>':'<button class="sec" data-a="revocar" data-c="'+E(l.codigo)+'">Revocar</button>')+'<button class="sec" data-a="dispositivos" data-c="'+E(l.codigo)+'">Dispositivos</button>'+(l.tipo==='invitacion'?'<button class="sec" data-a="convertir" data-c="'+E(l.codigo)+'">→ Licencia</button>':'')+'</td></tr>').join('')+'</table>';
 document.querySelectorAll('[data-a]').forEach(b=>b.onclick=async()=>{const c=b.dataset.c,a=b.dataset.a;try{
  if(a==='dispositivos'){const d=await api('/admin/licencias/'+c+'/dispositivos');const L=Object.entries(d.devs||{});if(confirm(c+': '+L.length+' dispositivos, '+d.activos+' activos ahora, '+(d.excesos||0)+' intentos sobre el límite.\n\n'+L.map(([k,v])=>k.slice(0,8)+' · último uso '+new Date(v.ultimo).toLocaleString('es-CO',{timeZone:'America/Bogota'})+' · '+v.ua.slice(0,50)).join('\n')+'\n\n¿Borrar la lista de dispositivos?'))await api('/admin/licencias/'+c+'/dispositivos/reset',{method:'POST'});return;}
  const body=a==='renovar'?{dias:30}:a==='revocar'?{motivo:prompt('Motivo de la revocación:','Suscripción no renovada')||''}:a==='convertir'?{cuenta:$('#lc').value,maxDispositivos:+$('#lm').value}:{};
  if(a==='revocar'&&!confirm('¿Revocar '+c+'? Dejará de funcionar de inmediato.'))return;await api('/admin/licencias/'+c+'/'+a,{method:'POST',body:JSON.stringify(body)});msg('Hecho: '+a+' '+c,1);cargar();}catch(e){msg(e.message);}});
 return true;}catch(e){msg(e.message);return false;}}
async function entrar(){$('#login').classList.add('hide');$('#panel').classList.remove('hide');if(!await cargar()){$('#panel').classList.add('hide');$('#login').classList.remove('hide');sessionStorage.removeItem('lm_adm_tok');}}
$('#entrar').onclick=()=>{sessionStorage.setItem('lm_adm_srv',$('#srv').value.trim());localStorage.setItem('lm_adm_srv',$('#srv').value.trim());sessionStorage.setItem('lm_adm_tok',$('#tok').value.trim());$('#tok').value='';entrar();};
$('#salir').onclick=()=>{sessionStorage.removeItem('lm_adm_tok');location.reload();};$('#recargar').onclick=cargar;
$('#migrar').onclick=async()=>{try{const r=await api('/admin/migrar',{method:'POST'});msg(r.migrados+' códigos marcados como invitación heredada (siguen completos)',1);cargar();}catch(e){msg(e.message);}};
$('#ccrear').onclick=async()=>{try{const a=await api('/admin/cuentas',{method:'POST',body:JSON.stringify({firma:$('#cf').value,nit:$('#cn').value,email:$('#ce').value})});msg('Cuenta '+a.id+' creada',1);cargar();}catch(e){msg(e.message);}};
$('#lcrear').onclick=async()=>{try{const l=await api('/admin/licencias',{method:'POST',body:JSON.stringify({cuenta:$('#lc').value,dias:+$('#ld').value,diario:+$('#lq').value,maxDispositivos:+$('#lm').value})});msg('Licencia '+l.codigo+' creada (vence '+f(l.vence)+'). Enlace: https://gdz87.github.io/lexmonitor/app/?codigo='+l.codigo,1);cargar();}catch(e){msg(e.message);}};
if(T()&&sessionStorage.getItem('lm_adm_srv'))entrar();
</script></body></html>
